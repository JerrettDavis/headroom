name: Release App Prototype

on:
  push:
    branches: [release-app-prototype]

permissions:
  contents: read

concurrency:
  group: release-app-prototype
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mint repository installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Prototype release PR
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: release-app-prototype
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          # Qualification creates a real release PR but publishes no artifacts.
          skip-github-release: true
