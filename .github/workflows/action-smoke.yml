name: action-smoke
on: push
permissions:
  contents: read
  issues: read
jobs:
  github-script-v9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const labels = await github.paginate(github.rest.issues.listLabels, {
              owner: 'headroomlabs-ai', repo: 'headroom', per_page: 100,
            });
            core.info(`v9 smoke: fetched ${labels.length} labels via octokit paginate`);
            console.log(labels.slice(0, 5).map((l) => l.name).join(', '));
  cosign-installer-v4:
    runs-on: ubuntu-latest
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - run: cosign version
