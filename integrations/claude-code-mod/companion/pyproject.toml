[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "headroom-claude-mod"
version = "0.1.0"
description = "Read-only, conversation-scoped Headroom telemetry for a Claude Code sidebar mod"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["fastapi>=0.115"]

[project.entry-points."headroom.proxy_extension"]
claude_mod = "headroom_claude_mod.extension:install"

[project.scripts]
headroom-mod = "headroom_claude_mod.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
